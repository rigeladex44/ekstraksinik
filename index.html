        );

        // Helper calculations
        const getZodiac = (day, month) => {
            if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return { name: 'Aries', emoji: '♈', desc: 'Mandiri & Berani' };
            if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return { name: 'Taurus', emoji: '♉', desc: 'Setia & Praktis' };
            if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return { name: 'Gemini', emoji: '♊', desc: 'Cerdas & Fleksibel' };
            if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return { name: 'Cancer', emoji: '♋', desc: 'Peka & Protektif' };
            if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return { name: 'Leo', emoji: '♌', desc: 'Kreatif & Percaya Diri' };
            if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return { name: 'Virgo', emoji: '♍', desc: 'Analitis & Rapi' };
            if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return { name: 'Libra', emoji: '♎', desc: 'Adil & Kooperatif' };
            if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return { name: 'Scorpio', emoji: '♏', desc: 'Fokus & Bertekad' };
            if ((month === 11 && day >= 22) || (month === 12 && day <= 21)) return { name: 'Sagittarius', emoji: '♐', desc: 'Optimis & Bebas' };
            if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return { name: 'Capricorn', emoji: '♑', desc: 'Disiplin & Ambisius' };
            if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return { name: 'Aquarius', emoji: '♒', desc: 'Original & Humanis' };
            return { name: 'Pisces', emoji: '♓', desc: 'Intuitif & Artistik' };
        };

        const getShio = (year) => {
            const shios = [
                { name: 'Tikus', emoji: '🐀', element: 'Air', nature: 'Cerdas, menawan, hemat' },
                { name: 'Kerbau', emoji: '🐂', element: 'Tanah', nature: 'Kuat, tekun, dapat diandalkan' },
                { name: 'Macan', emoji: '🐅', element: 'Kayu', nature: 'Berani, kompetitif, impulsif' },
                { name: 'Kelinci', emoji: '🐇', element: 'Kayu', nature: 'Lembut, tenang, waspada' },
                { name: 'Naga', emoji: '🐉', element: 'Tanah', nature: 'Kuat, berenergi, pemimpin' },
                { name: 'Ular', emoji: '🐍', element: 'Api', nature: 'Bijaksana, misterius, intuitif' },
                { name: 'Kuda', emoji: '🐎', element: 'Api', nature: 'Aktif, energik, independen' },
                { name: 'Kambing', emoji: '🐑', element: 'Tanah', nature: 'Lembut, simpatik, artistik' },
                { name: 'Monyet', emoji: '🐒', element: 'Logam', nature: 'Cerdas, jenaka, penuh rasa ingin tahu' },
                { name: 'Ayam', emoji: '🐓', element: 'Logam', nature: 'Rajin, berani, berbakat' },
                { name: 'Anjing', emoji: '🐕', element: 'Tanah', nature: 'Setia, jujur, waspada' },
                { name: 'Babi', emoji: '🐖', element: 'Air', nature: 'Penyayang, jujur, rajin' }
            ];
            let index = (year - 4) % 12;
            if (index < 0) index += 12;
            return shios[index];
        };

        const parseNik = (nik) => {
            const cleanNik = nik.trim().replace(/\D/g, '');

            if (cleanNik.length !== 16) {
                return {
                    nik: nik.trim() || '-',
                    isValid: false,
                    errorReason: cleanNik.length === 0 ? 'Data kosong' : `Panjang NIK salah (${cleanNik.length} digit, harus 16)`,
                    provinsi: '-',
                    provinsiCode: '-',
                    tanggalLahirStr: '-',
                    tanggalLahirObj: null,
                    jenisKelamin: '-',
                    umurDetail: { years: 0, months: 0, days: 0 },
                    zodiac: null,
                    shio: null,
                    dayOfWeek: '-'
                };
            }

            const provCode = cleanNik.substring(0, 2);
            const provName = PROVINCE_MAP[provCode];
            
            if (!provName) {
                return {
                    nik: cleanNik,
                    isValid: false,
                    errorReason: `Kode Provinsi (${provCode}) tidak dikenali`,
                    provinsi: '-',
                    provinsiCode: provCode,
                    tanggalLahirStr: '-',
                    tanggalLahirObj: null,
                    jenisKelamin: '-',
                    umurDetail: { years: 0, months: 0, days: 0 },
                    zodiac: null,
                    shio: null,
                    dayOfWeek: '-'
                };
            }

            try {
                const ddStr = cleanNik.substring(6, 8);
                const mmStr = cleanNik.substring(8, 10);
                const yyStr = cleanNik.substring(10, 12);

                let dd = parseInt(ddStr, 10);
                const mm = parseInt(mmStr, 10);
                let yy = parseInt(yyStr, 10);

                let jenisKelamin = 'Laki-Laki';
                if (dd > 40) {
                    jenisKelamin = 'Perempuan';
                    dd -= 40;
                }

                let fullYear = 1900 + yy;
                if (yy <= 30) {
                    fullYear = 2000 + yy;
                }

                // Check month bounds
                if (mm < 1 || mm > 12) {
                    return {
                        nik: cleanNik,
                        isValid: false,
                        errorReason: `Bulan lahir tidak valid (${mmStr})`,
                        provinsi: provName,
                        provinsiCode: provCode,
                        tanggalLahirStr: '-',
                        tanggalLahirObj: null,
                        jenisKelamin: jenisKelamin,
                        umurDetail: { years: 0, months: 0, days: 0 },
                        zodiac: null,
                        shio: null,
                        dayOfWeek: '-'
                    };
                }

                // Check day bounds based on actual calendar
                const daysInMonth = new Date(fullYear, mm, 0).getDate();
                if (dd < 1 || dd > 31) {
                    return {
                        nik: cleanNik,
                        isValid: false,
                        errorReason: `Tanggal lahir tidak valid (${ddStr})`,
                        provinsi: provName,
                        provinsiCode: provCode,
                        tanggalLahirStr: '-',
                        tanggalLahirObj: null,
                        jenisKelamin: jenisKelamin,
                        umurDetail: { years: 0, months: 0, days: 0 },
                        zodiac: null,
                        shio: null,
                        dayOfWeek: '-'
                    };
                }

                if (dd > daysInMonth) {
                    return {
                        nik: cleanNik,
                        isValid: false,
                        errorReason: `Bulan ${INDONESIAN_MONTHS[mm-1]} ${fullYear} hanya memiliki ${daysInMonth} hari (ditemukan ${dd})`,
                        provinsi: provName,
                        provinsiCode: provCode,
                        tanggalLahirStr: '-',
                        tanggalLahirObj: null,
                        jenisKelamin: jenisKelamin,
                        umurDetail: { years: 0, months: 0, days: 0 },
                        zodiac: null,
                        shio: null,
                        dayOfWeek: '-'
                    };
                }

                const birthDate = new Date(fullYear, mm - 1, dd);
                const dayOfWeek = INDONESIAN_DAYS[birthDate.getDay()];
                const padDD = dd.toString().padStart(2, '0');
                const birthDateStr = `${padDD} ${INDONESIAN_MONTHS[mm - 1]} ${fullYear}`;

                // Calculate exact age
                const today = new Date();
                let ageYears = today.getFullYear() - birthDate.getFullYear();
                let ageMonths = today.getMonth() - birthDate.getMonth();
                let ageDays = today.getDate() - birthDate.getDate();

                if (ageDays < 0) {
                    ageMonths -= 1;
                    const prevMonthDays = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
                    ageDays += prevMonthDays;
                }
                if (ageMonths < 0) {
                    ageYears -= 1;
                    ageMonths += 12;
                }

                // Zodiac & Shio
                const zodiac = getZodiac(dd, mm);
                const shio = getShio(fullYear);

                return {
                    nik: cleanNik,
                    isValid: true,
                    provinsi: provName,
                    provinsiCode: provCode,
                    tanggalLahirStr: birthDateStr,
                    tanggalLahirObj: birthDate,
                    jenisKelamin,
                    umurDetail: { years: ageYears, months: ageMonths, days: ageDays },
                    zodiac,
                    shio,
                    dayOfWeek
                };
            } catch (err) {
                return {
                    nik: cleanNik,
                    isValid: false,
                    errorReason: 'Kesalahan memproses algoritma NIK',
                    provinsi: provName || '-',
                    provinsiCode: provCode || '-',
                    tanggalLahirStr: '-',
                    tanggalLahirObj: null,
                    jenisKelamin: '-',
                    umurDetail: { years: 0, months: 0, days: 0 },
                    zodiac: null,
                    shio: null,
                    dayOfWeek: '-'
                };
            }
        };

        const App = () => {
            const [rawInput, setRawInput] = useState('');
            const [processedData, setProcessedData] = useState([]);
            const [notifications, setNotifications] = useState([]);
            const [darkMode, setDarkMode] = useState(false);
            const [activeTab, setActiveTab] = useState('table'); // 'table' | 'analytics'
            const [isDragging, setIsDragging] = useState(false);
            const [selectedNikDetails, setSelectedNikDetails] = useState(null);
            
            // Filters & Search & Sort states
            const [searchQuery, setSearchQuery] = useState('');
            const [filterGender, setFilterGender] = useState('all');
            const [filterValidity, setFilterValidity] = useState('all');
            const [filterProvince, setFilterProvince] = useState('all');
            const [sortBy, setSortBy] = useState('no'); // 'no' | 'nik' | 'age' | 'prov'
            const [sortOrder, setSortOrder] = useState('asc'); // 'asc' | 'desc'
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 10;

            // KTP custom fields state
            const [ktpName, setKtpName] = useState('BUDI SANTOSO');
            const [ktpAddress, setKtpAddress] = useState('JL. MAWAR INDAH NO. 45');
            const [ktpRtrw, setKtpRtrw] = useState('004/012');
            const [ktpKelDesa, setKtpKelDesa] = useState('PONDOK PINANG');
            const [ktpKecamatan, setKtpKecamatan] = useState('KEBAYORAN LAMA');
            const [ktpAgama, setKtpAgama] = useState('ISLAM');
            const [ktpStatus, setKtpStatus] = useState('BELUM KAWIN');
            const [ktpPekerjaan, setKtpPekerjaan] = useState('KARYAWAN SWASTA');
            const [ktpDarah, setKtpDarah] = useState('O');

            // Manage theme
            useEffect(() => {
                const storedTheme = localStorage.getItem('theme');
                if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    setDarkMode(true);
                    document.documentElement.classList.add('dark');
                } else {
                    setDarkMode(false);
                    document.documentElement.classList.remove('dark');
                }
            }, []);

            const toggleDarkMode = () => {
                if (darkMode) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    setDarkMode(false);
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    setDarkMode(true);
                }
            };

            const triggerNotification = (message, type = 'success') => {
                const newNotification = { id: Date.now(), message, type };
                setNotifications(prev => [...prev, newNotification]);
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== newNotification.id));
                }, 4000);
            };

            const handleProcess = () => {
                if (!rawInput.trim()) {
                    triggerNotification('Masukkan NIK terlebih dahulu.', 'error');
                    return;
                }
                const lines = rawInput.split(/[\n,\s]+/).filter(line => line.trim() !== '');
                const results = lines.map(line => parseNik(line));
                setProcessedData(results);
                setCurrentPage(1);

                const validCount = results.filter(r => r.isValid).length;
                if (results.length > 0) {
                    triggerNotification(`Berhasil memproses ${results.length} NIK (${validCount} Valid, ${results.length - validCount} Gagal).`, 'success');
                }
            };

            const handleClear = () => {
                setRawInput('');
                setProcessedData([]);
                setSelectedNikDetails(null);
                setCurrentPage(1);
                triggerNotification('Seluruh data berhasil dibersihkan.', 'info');
            };

            const loadDemoData = () => {
                const demoList = [
                    '3172010101900003', // DKI Jakarta, L, 1 Jan 1990
                    '3273024505850002', // Jawa Barat, P, 5 Mei 1985
                    '3578032010990001', // Jawa Timur, L, 20 Okt 1999
                    '1201021212050004', // Sumatera Utara, L, 12 Des 2005
                    '5102035508780006', // Bali, P, 15 Ags 1978
                    '3301012304920005', // Jawa Tengah, L, 23 Apr 1992
                    '3404024808010007', // DI Yogyakarta, P, 8 Ags 2001
                    '35010101',         // Gagal: pendek
                    '9999990101900001', // Gagal: provinsi salah
                    '3172013211900001'  // Gagal: tanggal 32
                ].join('\n');
                
                setRawInput(demoList);
                const results = demoList.split('\n').map(line => parseNik(line));
                setProcessedData(results);
                setCurrentPage(1);
                triggerNotification('Data demo berhasil dimuat.', 'info');
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragging(true);
            };

            const handleDragLeave = () => {
                setIsDragging(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    if (file.type === "text/plain" || file.name.endsWith('.txt') || file.name.endsWith('.csv')) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            setRawInput(event.target.result);
                            triggerNotification(`Membaca berkas: ${file.name}`);
                        };
                        reader.readAsText(file);
                    } else {
                        triggerNotification('Format berkas tidak didukung. Unggah .txt atau .csv', 'error');
                    }
                }
            };

            // Summary metrics
            const metrics = useMemo(() => {
                const total = processedData.length;
                const valid = processedData.filter(d => d.isValid).length;
                const invalid = total - valid;
                const male = processedData.filter(d => d.isValid && d.jenisKelamin === 'Laki-Laki').length;
                const female = processedData.filter(d => d.isValid && d.jenisKelamin === 'Perempuan').length;
                
                const validAges = processedData.filter(d => d.isValid).map(d => d.umurDetail.years);
                const avgAge = validAges.length > 0 ? Math.round(validAges.reduce((a, b) => a + b, 0) / validAges.length) : 0;

                return { total, valid, invalid, male, female, avgAge };
            }, [processedData]);

            // Unique provinces listed in current data
            const uniqueProvinces = useMemo(() => {
                const provs = {};
                processedData.forEach(d => {
                    if (d.isValid && d.provinsi !== '-') {
                        provs[d.provinsiCode] = d.provinsi;
                    }
                });
                return Object.entries(provs).map(([code, name]) => ({ code, name }));
            }, [processedData]);

            // Filtered and Sorted Data
            const filteredAndSortedData = useMemo(() => {
                let data = [...processedData];

                // Search query
                if (searchQuery.trim() !== '') {
                    const query = searchQuery.toLowerCase().trim();
                    data = data.filter(d => 
                        d.nik.toLowerCase().includes(query) || 
                        d.provinsi.toLowerCase().includes(query) ||
                        d.tanggalLahirStr.toLowerCase().includes(query) ||
                        d.jenisKelamin.toLowerCase().includes(query)
                    );
                }

                // Filter Gender
                if (filterGender !== 'all') {
                    data = data.filter(d => d.isValid && (filterGender === 'L' ? d.jenisKelamin === 'Laki-Laki' : d.jenisKelamin === 'Perempuan'));
                }

                // Filter Validity
                if (filterValidity !== 'all') {
                    data = data.filter(d => filterValidity === 'valid' ? d.isValid : !d.isValid);
                }

                // Filter Province
                if (filterProvince !== 'all') {
                    data = data.filter(d => d.isValid && d.provinsiCode === filterProvince);
                }

                // Sorting
                data.sort((a, b) => {
                    let valA, valB;
                    switch (sortBy) {
                        case 'nik':
                            valA = a.nik;
                            valB = b.nik;
                            break;
                        case 'age':
                            valA = a.isValid ? a.umurDetail.years : -1;
                            valB = b.isValid ? b.umurDetail.years : -1;
                            break;
                        case 'prov':
                            valA = a.provinsi;
                            valB = b.provinsi;
                            break;
                        default:
                            return 0; // retain initial array index order
                    }

                    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                });

                return data;
            }, [processedData, searchQuery, filterGender, filterValidity, filterProvince, sortBy, sortOrder]);

            // Pagination calculations
            const paginatedData = useMemo(() => {
                const startIdx = (currentPage - 1) * itemsPerPage;
                return filteredAndSortedData.slice(startIdx, startIdx + itemsPerPage);
            }, [filteredAndSortedData, currentPage]);

            const totalPages = Math.ceil(filteredAndSortedData.length / itemsPerPage);

            // Copy to Clipboard (Excel format)
            const copyToClipboard = () => {
                if (processedData.length === 0) {
                    triggerNotification('Tidak ada data untuk disalin.', 'error');
                    return;
                }
                const header = "No\tNIK\tProvinsi\tTanggal Lahir\tHari Lahir\tJenis Kelamin\tUmur\tZodiac\tShio\tStatus\n";
                const rows = processedData.map((d, index) => {
                    const status = d.isValid ? 'Valid' : `Gagal (${d.errorReason})`;
                    const ageStr = d.isValid ? `${d.umurDetail.years} Tahun ${d.umurDetail.months} Bulan` : '-';
                    const zodiacStr = d.isValid ? `${d.zodiac.emoji} ${d.zodiac.name}` : '-';
                    const shioStr = d.isValid ? `${d.shio.emoji} ${d.shio.name}` : '-';
                    return `${index + 1}\t${d.nik}\t${d.provinsi}\t${d.tanggalLahirStr}\t${d.dayOfWeek}\t${d.jenisKelamin}\t${ageStr}\t${zodiacStr}\t${shioStr}\t${status}`;
                }).join('\n');
                
                const fullText = header + rows;
                
                navigator.clipboard.writeText(fullText)
                    .then(() => triggerNotification('Salin ke Excel Berhasil! Format tab-separated siap di-paste ke Excel.'))
                    .catch(() => triggerNotification('Gagal menyalin data.', 'error'));
            };

            // Download CSV File
            const downloadCSV = () => {
                if (processedData.length === 0) {
                    triggerNotification('Tidak ada data untuk diunduh.', 'error');
                    return;
                }
                const headers = ['No', 'NIK', 'Provinsi', 'Tanggal Lahir', 'Hari Lahir', 'Jenis Kelamin', 'Umur', 'Zodiac', 'Shio', 'Status'];
                const csvRows = [headers.join(',')];
                
                processedData.forEach((d, idx) => {
                    const row = [
                        idx + 1,
                        `"${d.nik}"`,
                        `"${d.provinsi}"`,
                        `"${d.tanggalLahirStr}"`,
                        `"${d.dayOfWeek}"`,
                        `"${d.jenisKelamin}"`,
                        d.isValid ? `"${d.umurDetail.years} Tahun ${d.umurDetail.months} Bulan"` : '"-"',
                        d.isValid ? `"${d.zodiac.name}"` : '"-"',
                        d.isValid ? `"${d.shio.name}"` : '"-"',
                        d.isValid ? '"Valid"' : `"${d.errorReason}"`
                    ];
                    csvRows.push(row.join(','));
                });
                
                const csvContent = "data:text/csv;charset=utf-8," + csvRows.join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `ekstraksi_nik_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                triggerNotification('File CSV berhasil diunduh.');
            };

            // Download JSON File
            const downloadJSON = () => {
                if (processedData.length === 0) {
                    triggerNotification('Tidak ada data untuk diunduh.', 'error');
                    return;
                }
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(processedData, null, 2));
                const link = document.createElement("a");
                link.setAttribute("href", dataStr);
                link.setAttribute("download", `ekstraksi_nik_${Date.now()}.json`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                triggerNotification('File JSON berhasil diunduh.');
            };

            // Charts data calculations
            const chartsData = useMemo(() => {
                if (processedData.length === 0) return null;
                
                const validData = processedData.filter(d => d.isValid);
                
                // Age Groups
                let ageGroups = {
                    'Anak-anak (<12)': 0,
                    'Remaja (12-25)': 0,
                    'Dewasa (26-45)': 0,
                    'Setengah Baya (46-60)': 0,
                    'Lansia (>60)': 0
                };
                
                // Provinces Frequency
                let provincesFreq = {};

                validData.forEach(d => {
                    const age = d.umurDetail.years;
                    if (age < 12) ageGroups['Anak-anak (<12)']++;
                    else if (age <= 25) ageGroups['Remaja (12-25)']++;
                    else if (age <= 45) ageGroups['Dewasa (26-45)']++;
                    else if (age <= 60) ageGroups['Setengah Baya (46-60)']++;
                    else ageGroups['Lansia (>60)']++;

                    provincesFreq[d.provinsi] = (provincesFreq[d.provinsi] || 0) + 1;
                });

                const sortedProvinces = Object.entries(provincesFreq)
                    .map(([name, count]) => ({ name, count }))
                    .sort((a, b) => b.count - a.count);

                return { ageGroups, sortedProvinces };
            }, [processedData]);

            // Interactive NIK structure explorer hover states
            const [hoveredSegment, setHoveredSegment] = useState(null);
            
            return (
                <div className="flex flex-col flex-grow w-full">
                    {/* Header */}
                    <header className="sticky top-0 z-40 w-full glass-panel border-b border-slate-200/50 dark:border-slate-800/50 transition-all duration-300">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-fingerprint"><path d="M12 10a2 2 0 0 0-2 2c0 .991-.192 1.355-.384 1.718-.192.363-.448.845-.448 1.48C9.168 16.48 9.5 18 12 18s2.832-1.52 2.832-2.8c0-.636-.256-1.118-.448-1.48-.192-.363-.384-.727-.384-1.718a2 2 0 0 0-2-2z"/><path d="M8 12a4 4 0 0 1 8 0c0 .523-.213.91-.424 1.29-.212.38-.466.837-.466 1.51C15.11 16.51 14 19 12 19s-3.11-2.49-3.11-4.2c0-.673-.254-1.13-.466-1.51C8.213 12.91 8 12.523 8 12z"/><path d="M6 12a6 6 0 0 1 12 0c0 .034 0 .067-.002.1a3.298 3.298 0 0 0-.256-.039C16.924 11.944 16.5 11.5 16.5 11a4.5 4.5 0 0 0-9 0c0 .5-.424.944-1.242 1.061A3.298 3.298 0 0 0 6 12z"/><path d="M3 10.27c.18-.517.45-1.002.81-1.437A9.01 9.01 0 0 1 12 6a9.01 9.01 0 0 1 8.19 2.833c.36.435.63.92.81 1.437"/><path d="M14 21.9a10 10 0 0 1-10.9-4.7"/><path d="M20 17.2a10 10 0 0 0-1.7-8.3"/></svg>
                                </div>
                                <div>
                                    <h1 className="text-base font-extrabold tracking-tight bg-gradient-to-r from-brand-600 to-indigo-500 dark:from-brand-400 dark:to-indigo-300 bg-clip-text text-transparent">
                                        EKSTRAKTOR NIK
                                    </h1>
                                    <p className="text-[10px] text-slate-400 dark:text-slate-500 font-medium tracking-widest uppercase">
                                        Premium Parser & Analytics
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="hidden sm:flex items-center gap-1.5 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs px-2.5 py-1 rounded-full font-medium border border-emerald-500/20">
                                    <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping"></span>
                                    100% Client-Side / Offline
                                </div>
                                <button 
                                    onClick={toggleDarkMode}
                                    className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors"
                                    aria-label="Toggle theme"
                                    id="theme-toggle"
                                >
                                    {darkMode ? <IconSun /> : <IconMoon />}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                        
                        {/* Notification Toasts */}
                        <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-md w-full">
                            {notifications.map(n => (
                                <div 
                                    key={n.id} 
                                    className={`p-4 rounded-xl shadow-lg border transition-all duration-300 flex items-start gap-3 animate-slide-in ${
                                        n.type === 'error' 
                                            ? 'bg-rose-50 border-rose-200 text-rose-800 dark:bg-rose-950/60 dark:border-rose-900/60 dark:text-rose-200' 
                                            : n.type === 'info'
                                            ? 'bg-blue-50 border-blue-200 text-blue-800 dark:bg-blue-950/60 dark:border-blue-900/60 dark:text-blue-200'
                                            : 'bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-950/60 dark:border-emerald-900/60 dark:text-emerald-200'
                                    }`}
                                >
                                    <div className="mt-0.5">
                                        {n.type === 'error' ? <IconX /> : n.type === 'info' ? <IconInfo /> : <IconCheck />}
                                    </div>
                                    <p className="text-sm font-medium leading-tight">{n.message}</p>
                                </div>
                            ))}
                        </div>

                        {/* Top KPI Cards */}
                        <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                            <div className="bg-white dark:bg-[#0f172a] p-4 rounded-2xl border border-slate-100 dark:border-slate-800/80 shadow-premium dark:shadow-premium-dark flex items-center gap-3.5 hover:-translate-y-0.5 transition-transform duration-300">
                                <div className="p-3 rounded-xl bg-brand-500/10 text-brand-600 dark:text-brand-400">
                                    <IconUsers />
                                </div>
                                <div>
                                    <p className="text-xs text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">Total NIK</p>
                                    <h3 className="text-xl font-extrabold text-slate-900 dark:text-white mt-0.5">{metrics.total}</h3>
                                </div>
                            </div>

                            <div className="bg-white dark:bg-[#0f172a] p-4 rounded-2xl border border-slate-100 dark:border-slate-800/80 shadow-premium dark:shadow-premium-dark flex items-center gap-3.5 hover:-translate-y-0.5 transition-transform duration-300">
                                <div className="p-3 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
                                    <IconCheck />
                                </div>
                                <div>
                                    <p className="text-xs text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">Valid</p>

                            </div>

                                <div className="p-3 rounded-xl bg-rose-500/10 text-rose-600 dark:text-rose-400">
                                    <IconX />

                                <div>
                                    <p className="text-xs text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">Gagal</p>
                                    <h3 className="text-xl font-extrabold text-slate-900 dark:text-white mt-0.5">{metrics.invalid}</h3>
                                </div>
                            </div>

                            <div className="bg-white dark:bg-[#0f172a] p-4 rounded-2xl border border-slate-100 dark:border-slate-800/80 shadow-premium dark:shadow-premium-dark flex items-center gap-3.5 hover:-translate-y-0.5 transition-transform duration-300 col-span-1">

                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-venus-and-mars"><path d="M10 20H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6"/><circle cx="16" cy="16" r="4"/><path d="M16 12v-2"/><path d="M16 20h.01"/><path d="m9 15 3-3"/></svg>
                                </div>
                                <div>
                                    <p className="text-xs text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">L / P Ratio</p>
                                    <h3 className="text-base font-extrabold text-slate-900 dark:text-white mt-0.5">
                                        {metrics.male}<span className="text-slate-300 dark:text-slate-700 mx-1">/</span>{metrics.female}
                                    </h3>
                                </div>

                                    <IconTrendingUp />

                        {/* Middle Workspaces */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                            
                            {/* Input Column */}

                                {/* Raw Input Panel */}

                                        </label>

                                        >

                                        </button>

                                    {/* Textarea Dropzone */}
                                    <div className="relative flex-grow">
                                        <textarea

                                            className="w-full h-72 p-4 bg-slate-50/50 dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800/80 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none resize-y font-mono text-sm placeholder-slate-400 dark:placeholder-slate-600 text-slate-800 dark:text-slate-200 transition-all duration-200 leading-relaxed"
                                            placeholder="Contoh:&#10;3507121808580001&#10;3507116506690003&#10;&#10;Atau seret file .txt/.csv ke sini..."
                                            value={rawInput}

                                        {isDragging && (
