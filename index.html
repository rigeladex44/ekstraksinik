<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ekstraktor NIK</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        /* Custom scrollbar for better appearance */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Container for React App -->
    <div id="root"></div>

    <script type="text/babel">
        // Since we are not using a bundler, we extract hooks directly from the global React object
        const { useState, useEffect } = React;

        // Inline SVG Icons as replacements for Lucide React components
        const IconInfo = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-info w-8 h-8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const IconInfoSmall = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-info w-4 h-4"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );
        const IconUpload = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-upload w-4 h-4"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        );
        const IconTrash2 = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-trash-2 w-4 h-4"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        );
        const IconCopy = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-copy w-4 h-4"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const IconDownloadBig = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-download w-12 h-12 text-gray-300"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        );

        const App = () => {
            const [rawInput, setRawInput] = useState('');
            const [processedData, setProcessedData] = useState([]);
            const [notification, setNotification] = useState({ show: false, message: '', type: 'success' });

            useEffect(() => {
                if (notification.show) {
                    const timer = setTimeout(() => {
                        setNotification({ ...notification, show: false });
                    }, 3000);
                    return () => clearTimeout(timer);
                }
            }, [notification]);

            const showNotification = (message, type = 'success') => {
                setNotification({ show: true, message, type });
            };

            const processNik = (nik) => {
                const cleanNik = nik.trim().replace(/\D/g, '');

                if (cleanNik.length !== 16) {
                    return {
                        nik: nik.trim() || '-',
                        tanggalLahir: 'Invalid NIK (16 digit)',
                        jenisKelamin: '-',
                        isValid: false,
                    };
                }

                try {
                    const ddStr = cleanNik.substring(6, 8);
                    const mmStr = cleanNik.substring(8, 10);
                    const yyStr = cleanNik.substring(10, 12);

                    let dd = parseInt(ddStr, 10);
                    const mm = parseInt(mmStr, 10);
                    let yy = parseInt(yyStr, 10);

                    let jenisKelamin = 'L';
                    if (dd > 40) {
                        jenisKelamin = 'P';
                        dd -= 40;
                    }

                    let fullYear = 1900 + yy;
                    if (yy <= 30) {
                        fullYear = 2000 + yy;
                    }

                    let tanggalLahirStr = '-';
                    if (dd > 0 && dd <= 31 && mm > 0 && mm <= 12) {
                        const padDD = dd.toString().padStart(2, '0');
                        const padMM = mm.toString().padStart(2, '0');
                        tanggalLahirStr = `${padDD}/${padMM}/${fullYear}`;
                    } else {
                        tanggalLahirStr = 'Tgl Tidak Valid';
                    }

                    return {
                        nik: cleanNik,
                        tanggalLahir: tanggalLahirStr,
                        jenisKelamin: jenisKelamin,
                        isValid: tanggalLahirStr !== 'Tgl Tidak Valid',
                    };
                } catch (error) {
                    return {
                        nik: cleanNik,
                        tanggalLahir: 'Error parsing',
                        jenisKelamin: '-',
                        isValid: false,
                    };
                }
            };

            const handleInputChange = (e) => {
                setRawInput(e.target.value);
            };

            const handleProcess = () => {
                if (!rawInput.trim()) {
                    showNotification('Silakan masukkan NIK terlebih dahulu.', 'error');
                    return;
                }
                const rawList = rawInput.split(/[\n,]/).filter(item => item.trim() !== '');
                const processed = rawList.map(processNik);
                setProcessedData(processed);
                
                if (processed.length > 0) {
                    showNotification(`Berhasil memproses ${processed.length} NIK.`);
                }
            };

            const handleClear = () => {
                setRawInput('');
                setProcessedData([]);
                showNotification('Data dibersihkan.');
            };

            const handleCopyToClipboard = () => {
                if (processedData.length === 0) {
                    showNotification('Tidak ada data untuk disalin.', 'error');
                    return;
                }

                const header = "NIK\tTanggal Lahir\tL/P\n";
                const rows = processedData.map(row => `${row.nik}\t${row.tanggalLahir}\t${row.jenisKelamin}`).join('\n');
                const fullText = header + rows;

                try {
                    const el = document.createElement('textarea');
                    el.value = fullText;
                    el.setAttribute('readonly', '');
                    el.style.position = 'absolute';
                    el.style.left = '-9999px';
                    document.body.appendChild(el);
                    const selected =
                        document.getSelection().rangeCount > 0
                        ? document.getSelection().getRangeAt(0)
                        : false;
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    if (selected) {
                        document.getSelection().removeAllRanges();
                        document.getSelection().addRange(selected);
                    }
                    showNotification('Disalin ke clipboard! (Siap di-paste ke Excel)');
                } catch (err) {
                    showNotification('Gagal menyalin teks.', 'error');
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 p-4 md:p-8 font-sans text-gray-800">
                    {notification.show && (
                        <div className={`fixed top-4 right-4 p-4 rounded shadow-lg transition-opacity duration-300 z-50 ${notification.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`}>
                        {notification.message}
                        </div>
                    )}

                    <div className="max-w-6xl mx-auto space-y-6">
                        <header className="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
                        <h1 className="text-2xl md:text-3xl font-bold text-blue-700 flex items-center gap-2">
                            <IconInfo />
                            Dashboard Data NIK
                        </h1>
                        <p className="text-gray-600 mt-2 text-sm md:text-base">
                            Masukkan daftar NIK (Nomor Induk Kependudukan) untuk secara otomatis mengekstrak Tanggal Lahir dan Jenis Kelamin berdasarkan kode di dalamnya.
                        </p>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 flex flex-col gap-4">
                            <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex-grow flex flex-col">
                            <label htmlFor="nik-input" className="block text-sm font-semibold text-gray-700 mb-2">
                                Paste NIK di sini (satu NIK per baris):
                            </label>
                            <textarea
                                id="nik-input"
                                className="w-full h-64 lg:flex-grow p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y font-mono text-sm placeholder-gray-400"
                                placeholder="Contoh:&#10;3507121808580001&#10;3507116506690003"
                                value={rawInput}
                                onChange={handleInputChange}
                            />
                            
                            <div className="flex gap-2 mt-4">
                                <button
                                onClick={handleProcess}
                                className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
                                >
                                <IconUpload /> Proses NIK
                                </button>
                                <button
                                onClick={handleClear}
                                className="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center"
                                title="Bersihkan input dan hasil"
                                >
                                <IconTrash2 />
                                </button>
                            </div>
                            </div>
                            
                            <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl">
                            <h3 className="text-sm font-semibold text-blue-800 mb-1 flex items-center gap-1">
                                <IconInfoSmall /> Info Rumus
                            </h3>
                            <p className="text-xs text-blue-700 leading-relaxed">
                                Aplikasi by: ADEX IDN<br/>
                                <code className="bg-blue-100 px-1 py-0.5 rounded text-blue-900 mt-1 inline-block break-all block">Tgl Lahir: MOD(DD, 40)/MM/IF(YY&lt;=30,20YY,19YY)</code><br/>
                                <code className="bg-blue-100 px-1 py-0.5 rounded text-blue-900 mt-1 inline-block break-all block">L/P: IF(DD&gt;40, "P", "L")</code>
                            </p>
                            </div>
                        </div>

                        {}
                        <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                            <div className="p-4 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gray-50/50">
                            <h2 className="text-lg font-semibold text-gray-800 flex items-center gap-2">
                                Hasil Ekstraksi <span className="bg-blue-100 text-blue-800 text-xs py-1 px-2 rounded-full">{processedData.length} Data</span>
                            </h2>
                            
                            <div className="flex gap-2">
                                <button
                                onClick={handleCopyToClipboard}
                                disabled={processedData.length === 0}
                                className={`py-1.5 px-3 rounded-md flex items-center gap-1.5 text-sm font-medium transition-colors ${
                                    processedData.length > 0 
                                    ? 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 shadow-sm' 
                                    : 'bg-gray-100 text-gray-400 cursor-not-allowed border border-gray-200'
                                }`}
                                >
                                <IconCopy /> Copy untuk Excel
                                </button>
                            </div>
                            </div>

                            <div className="overflow-x-auto flex-grow h-[500px]">
                            {processedData.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400 p-8 text-center space-y-3">
                                <IconDownloadBig />
                                <p>Belum ada data. Silakan paste NIK di kolom sebelah kiri dan klik "Proses NIK".</p>
                                </div>
                            ) : (
                                <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50 sticky top-0 z-10 shadow-sm">
                                    <tr>
                                    <th scope="col" className="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-12 text-center">
                                        No
                                    </th>
                                    <th scope="col" className="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        NIK
                                    </th>
                                    <th scope="col" className="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        Tanggal Lahir
                                    </th>
                                    <th scope="col" className="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                        L/P
                                    </th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-100 font-mono text-sm">
                                    {processedData.map((item, index) => (
                                    <tr key={index} className={`hover:bg-blue-50/30 transition-colors ${!item.isValid ? 'bg-red-50' : ''}`}>
                                        <td className="px-6 py-3 whitespace-nowrap text-gray-500 text-center">
                                        {index + 1}
                                        </td>
                                        <td className={`px-6 py-3 whitespace-nowrap font-medium ${!item.isValid ? 'text-red-600' : 'text-gray-900'}`}>
                                        {item.nik}
                                        </td>
                                        <td className={`px-6 py-3 whitespace-nowrap text-center ${!item.isValid ? 'text-red-500' : 'text-gray-600'}`}>
                                        {item.tanggalLahir}
                                        </td>
                                        <td className="px-6 py-3 whitespace-nowrap text-center">
                                        <span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold
                                            ${item.jenisKelamin === 'L' ? 'bg-blue-100 text-blue-800' : 
                                            item.jenisKelamin === 'P' ? 'bg-pink-100 text-pink-800' : 
                                            'bg-gray-100 text-gray-500'}`}
                                        >
                                            {item.jenisKelamin}
                                        </span>
                                        </td>
                                    </tr>
                                    ))}
                                </tbody>
                                </table>
                            )}
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
